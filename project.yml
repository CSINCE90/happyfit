name: HappyFit

options:
  bundleIdPrefix: com.csince90
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Inserisci qui il tuo Team ID (Xcode > Settings > Accounts, oppure developer.apple.com > Membership)
    # DEVELOPMENT_TEAM: XXXXXXXXXX

targets:
  HappyFit:
    type: application
    platform: iOS
    sources:
      - HappyFit
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.csince90.happyfit
        PRODUCT_NAME: HappyFit
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HappyFit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: HappyFitWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch

  HappyFitWatch:
    type: application
    platform: watchOS
    sources:
      - HappyFitWatch
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.csince90.happyfit.watchkitapp
        PRODUCT_NAME: HappyFitWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HappyFit
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.csince90.happyfit
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES

  HappyFitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HappyFitTests
    dependencies:
      - target: HappyFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.csince90.happyfit.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HappyFit.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HappyFit
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  HappyFit:
    build:
      targets:
        HappyFit: all
        HappyFitTests: [test]
    test:
      targets:
        - HappyFitTests
  HappyFitWatch:
    build:
      targets:
        HappyFitWatch: all
